[package]
name = "cola_three"
version.workspace = true
edition.workspace = true

[dependencies]
## 内部依赖
cola_data = { path = "../cola_data" }
repository = {path = "../repository" }

## 外部依赖
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
validator = { version = "0.19", features = ["derive"] }

