# 依赖结构
# 2026-06-05 更新：项目重构后新的模块拆分

# 项目核心分层与依赖拓扑规范
# 核心原则：依赖倒置。由下层（Repo / Network）去实现上层（Business）定义的 trait

architecture:
    api_layer:
        name: "Api (Transport 传输层)"
        depends_on:
            - "App"
            - "Business Modules"
            - "Kits"
        description: "对外接口（HTTP / gRPC），接收请求转换为 Command 抛给业务模块"
        crates:
            - api

    app_layer:
        name: "App (应用核心 & 状态机)"
        depends_on:
            - "Business Modules"
            - "Repo"
            - "Network"
            - "Kits"
        description: |
            全局应用状态管理、配置加载、数据库连接池初始化。
            注册所有路由、中间件，作为整个系统的入口编排层。
        crates:
            - app
        entrypoint:
            - src/main.rs
            - src/app.rs

    business_layer:
        name: "Business Modules (业务模块)"
        depends_on:
            - "Repo"
            - "Network"
            - "Gateway"
            - "Kits"
        description: |
            纯粹的业务逻辑层。每个模块负责一个独立业务域：
            - cola_auth: 认证/登录/注册
            - cola_client: 客户端管理
            - cola_data: 数据聚合层（实体/信息/命令/事件）
            - cola_dynamic: 动态/朋友圈
            - cola_gift: 礼物系统
            - cola_live: 直播
            - cola_music: 音乐
            - cola_user: 用户管理
            - cola_video: 视频（CRUD/评论/弹幕/交互）
        crates:
            - cola_auth
            - cola_client
            - cola_data
            - cola_dynamic
            - cola_gift
            - cola_live
            - cola_music
            - cola_user
            - cola_video

    kits_layer:
        name: "Kits (工具层)"
        depends_on: []
        description: "通用工具库，零外部依赖。提供共享的辅助函数、适配器、中间件抽象"
        crates:
            - kits

    repo_layer:
        name: "Repo (数据仓储层)"
        depends_on:
            - "Kits"
        description: |
            物理数据来源。实现业务模块定义的 trait，由 sqlx/redis 驱动。
            分为 auth / user / video / live / dynamic 等存储域。
        crates:
            - repo
        contains:
            - pg (PostgreSQL 实现)
            - redis (Redis 缓存实现)
            - service (组合仓储对外提供服务)

    gateway_layer:
        name: "Gateway / Health / IM (基础设施网关)"
        depends_on:
            - "Kits"
            - "Network"
        description: |
            轻量级网关与基础设施服务：
            - gateway: 认证网关（session 校验 / token 管理）
            - health: 健康检查
            - im: 即时通讯模块
        crates:
            - gateway
            - health
            - im

    network_layer:
        name: "Network (网络层)"
        depends_on:
            - "Kits"
        description: |
            外部依赖的客户端封装：
            - http (HTTP 客户端/服务端)
            - grpc (gRPC 通信)
            - qiniu (七牛云)
            - s3 (对象存储)
            - sms (短信)
            - wt (WebSocket Transport)
        crates:
            - network

    migrations:
        name: "Migrations (数据库迁移)"
        depends_on: []
        description: "SQL 迁移脚本，通过 sqlx-cli 管理"
        path: migrations/

global_shared:
    name: "Shared Data / Entity"
    description: "cola_data 作为全局数据层，提供 entity / info / vo / command / event 等纯结构体"
    rule: "纯结构体，不包含任何业务与传输逻辑，可被任何层引用"
    contains:
        - entity (原始表结构)
        - info (领域数据元信息)
        - vo (领域视图对象)
        - command (创建命令)
        - event (消息事件)
        - aggregate (聚合模型)
        - bridge (适配器接口)