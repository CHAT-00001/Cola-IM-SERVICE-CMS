#### 可乐 用户中心
# 2026-04-05 10:20

[package]
name = "cola_user"
version = "0.1.0"
edition = "2024"

[dependencies]
#### 内部依赖
kits = { path = "../kits" }
network = { path = "../network"}
cola_data = { path = "../cola_data" }
repo = { path = "../repo" }

#### 外部依赖
futures = "0.3.31"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
tokio = "1.47.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
state = "0.6.0"
anyhow = "1.0.99"
toml = "0.9.5"
once_cell = "1.21.3"
val = "0.3.6"
futures-util = "0.3.31"
thiserror = "1.0.61"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8.5"
redis = "1.0.3"
async-trait = "0.1.89"
format = "0.2.4"
# 自动验证
validator = { version = "0.20.0", features = ["derive"] }
ipnetwork = "0.20.0"



