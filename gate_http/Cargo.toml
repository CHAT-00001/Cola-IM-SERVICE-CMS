##### gate_http/src/cargo.toml

[package]
name = "gate_http"
version = "0.1.0"
edition = "2024"

[dependencies]
## 本地模块
cola_video = { path = "../cola_video" }
app_config = { path = "../app" }
cola_data = { path = "../cola_data" }
network = { path = "../network" }


## 外部模块
actix-web = "4.11.0"
axum = "0.8.9"
futures = "0.3.31"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = "1.47.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4"] }
state = "0.6.0"
anyhow = "1.0.99"
toml = "0.9.5"
once_cell = "1.21.3"
val = "0.3.6"
futures-util = "0.3.31"
# 建议选这个，它是纯 Rust 实现，兼容性最好，编译最省事
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.10.0"